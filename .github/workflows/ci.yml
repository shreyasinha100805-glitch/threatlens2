name: ThreatLens CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-check:
    name: Backend Build & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Check Backend Code Syntax
        run: |
          cd backend
          node --check index.js
          node --check agent.js
          node --check tools.js
          node --check mongoMCP.js
          node --check genaiClient.js
          node --check embedLogs.js
          node --check auth.js
          node --check billing.js
          node --check circleCheckout.js
          node --check circleSetup.js
          node --check agentPayments.js
          node --check alerts.js
          node --check entitlements.js
          node --check logSchema.js
          node --check seed.js
          node --check waitlist.js

  frontend-build:
    name: Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build & Typecheck Frontend
        run: |
          cd frontend
          npm run build


