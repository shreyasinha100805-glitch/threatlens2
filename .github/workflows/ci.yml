name: ThreatLens CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: ThreatLens CI (Backend & Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Check Backend
        run: |
          cd backend
          npm ci || npm install
          node --check index.js
          node --check agent.js
          node --check tools.js
          node --check mongoMCP.js
          node --check genaiClient.js
          node --check embedLogs.js
          node --check auth.js
          node --check billing.js
          node --check circleCheckout.js
          node --check circleSetup.js
          node --check agentPayments.js
          node --check alerts.js

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build
